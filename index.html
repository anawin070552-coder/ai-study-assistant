<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtPlan 🏀</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #09090b;
      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 40px 0 70px;
    }

    .hero {
      padding: 45px 0;
    }

    .tag {
      color: #ff7a00;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 90px);
      line-height: .95;
      letter-spacing: -4px;
    }

    h1 span {
      color: #ff7a00;
    }

    .subtitle {
      color: #999;
      font-size: 18px;
      margin-top: 25px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      margin-top: 30px;
      background: #ff7a00;
      color: #111;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
    }

    .add-btn:active {
      transform: scale(.97);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #141417;
      border: 1px solid #27272a;
      border-radius: 22px;
      padding: 25px;
    }

    .section-title {
      color: #ff7a00;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day {
      min-height: 105px;
      background: #1b1b20;
      border: 1px solid #29292e;
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .day:hover {
      border-color: #ff7a00;
    }

    .day.today {
      border: 2px solid #ff7a00;
    }

    .day-name {
      color: #888;
      font-size: 12px;
    }

    .date {
      font-size: 21px;
      font-weight: bold;
      margin: 8px 0;
    }

    .training-dot {
      display: block;
      color: #ff7a00;
      font-size: 13px;
      margin-top: 4px;
    }

    .streak {
      font-size: 60px;
      font-weight: bold;
      margin: 15px 0;
    }

    .streak span {
      font-size: 32px;
    }

    .muted {
      color: #888;
    }

    .training-list {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .training-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1b1b20;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #29292e;
    }

    .training-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .training-item small {
      color: #888;
    }

    .delete-btn {
      background: transparent;
      color: #777;
      font-size: 18px;
      padding: 8px;
    }

    .delete-btn:hover {
      color: #ff5b5b;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(500px, 100%);
      background: #151518;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 25px;
    }

    .modal-box h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 14px;
      margin: 15px 0 7px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #0e0e10;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff7a00;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .save-btn {
      flex: 1;
      background: #ff7a00;
      padding: 14px;
      border-radius: 12px;
    }

    .cancel-btn {
      flex: 1;
      background: #29292e;
      color: white;
      padding: 14px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      color: #555;
      margin-top: 50px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .calendar {
        grid-template-columns: repeat(4, 1fr);
      }

      .day {
        min-height: 95px;
      }

      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="hero">
      <div class="tag">BASKETBALL TRAINING</div>

      <h1>
        Train smart.<br>
        <span>Play better.</span>
      </h1>

      <p class="subtitle">
        วางแผนการซ้อมบาสของคุณ และพัฒนาตัวเองให้ดีขึ้นทุกวัน 🏀
      </p>

      <button class="add-btn" onclick="openModal()">
        ＋ สร้างตารางซ้อม
      </button>
    </section>

    <div class="grid">

      <section class="card">
        <div class="section-title">WEEKLY CALENDAR</div>
        <h2>สัปดาห์นี้</h2>

        <div id="calendar" class="calendar"></div>
      </section>

      <section class="card">
        <div class="section-title">TRAINING STREAK</div>

        <div class="streak">
          🔥 <span id="streak">0</span> วัน
        </div>

        <p class="muted">
          ซ้อมต่อเนื่องให้ครบทุกวัน แล้วรักษา Streak ไว้! 🔥
        </p>

        <div id="trainingList" class="training-list"></div>
      </section>

    </div>

    <footer>
      CourtPlan 🏀 — Train smart. Play better.
    </footer>

  </main>

  <!-- MODAL -->
  <div id="modal" class="modal">

    <div class="modal-box">

      <h2>🏀 เพิ่มตารางซ้อม</h2>

      <label>วันที่</label>
      <input id="trainingDate" type="date">

      <label>ประเภทการซ้อม</label>
      <select id="trainingType">
        <option>🏀 Ball Handling</option>
        <option>🎯 Shooting</option>
        <option>⚡ Speed & Agility</option>
        <option>💪 Strength</option>
        <option>🛡️ Defense</option>
        <option>🏆 Game Training</option>
        <option>🧘 Recovery</option>
      </select>

      <label>เวลา</label>
      <input id="trainingTime" type="time">

      <label>ระยะเวลา (นาที)</label>
      <input id="trainingDuration" type="number" value="60" min="1">

      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">
          ยกเลิก
        </button>

        <button class="save-btn" onclick="saveTraining()">
          บันทึกตาราง
        </button>
      </div>

    </div>

  </div>

<script>

  let trainings = JSON.parse(
    localStorage.getItem("courtplan_trainings") || "[]"
  );

  function saveData() {
    localStorage.setItem(
      "courtplan_trainings",
      JSON.stringify(trainings)
    );
  }

  function openModal() {

    document.getElementById("modal").classList.add("show");

    const today = new Date()
      .toISOString()
      .split("T")[0];

    document.getElementById("trainingDate").value = today;
    document.getElementById("trainingTime").value = "17:00";
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("show");
  }

  function saveTraining() {

    const date =
      document.getElementById("trainingDate").value;

    const type =
      document.getElementById("trainingType").value;

    const time =
      document.getElementById("trainingTime").value;

    const duration =
      document.getElementById("trainingDuration").value;

    if (!date) {
      alert("กรุณาเลือกวันที่");
      return;
    }

    trainings.push({
      id: Date.now(),
      date,
      type,
      time,
      duration
    });

    saveData();

    closeModal();

    renderCalendar();
    renderTrainingList();
    updateStreak();
  }

  function deleteTraining(id) {

    trainings = trainings.filter(
      item => item.id !== id
    );

    saveData();

    renderCalendar();
    renderTrainingList();
    updateStreak();
  }

  function getWeekDates() {

    const today = new Date();

    const day = today.getDay();

    const mondayOffset =
      day === 0 ? -6 : 1 - day;

    const monday = new Date(today);

    monday.setDate(
      today.getDate() + mondayOffset
    );

    const dates = [];

    for (let i = 0; i < 7; i++) {

      const d = new Date(monday);

      d.setDate(monday.getDate() + i);

      dates.push(d);
    }

    return dates;
  }

  function dateKey(date) {

    return date
      .toISOString()
      .split("T")[0];
  }

  function renderCalendar() {

    const calendar =
      document.getElementById("calendar");

    calendar.innerHTML = "";

    const weekDays = [
      "จ.",
      "อ.",
      "พ.",
      "พฤ.",
      "ศ.",
      "ส.",
      "อา."
    ];

    getWeekDates().forEach((date, index) => {

      const key = dateKey(date);

      const dayTrainings =
        trainings.filter(t => t.date === key);

      const todayKey =
        dateKey(new Date());

      const div =
        document.createElement("div");

      div.className =
        "day" +
        (key === todayKey ? " today" : "");

      let trainingHTML = "";

      dayTrainings.forEach(t => {

        trainingHTML += `
          <span class="training-dot">
            🏀 ${t.type.split(" ").slice(1).join(" ")}
          </span>
        `;

      });

      div.innerHTML = `
        <div class="day-name">
          ${weekDays[index]}
        </div>

        <div class="date">
          ${date.getDate()}
        </div>

        ${trainingHTML}
      `;

      div.onclick = () => {

        document.getElementById(
          "trainingDate"
        ).value = key;

        openModal();

      };

      calendar.appendChild(div);

    });
  }

  function renderTrainingList() {

    const list =
      document.getElementById("trainingList");

    list.innerHTML = "";

    const sorted =
      [...trainings]
      .sort((a,b) =>
        a.date.localeCompare(b.date)
      );

    if (sorted.length === 0) {

      list.innerHTML = `
        <div class="muted">
          ยังไม่มีตารางซ้อม<br>
          กด “＋ สร้างตารางซ้อม” เพื่อเริ่มต้น 🏀
        </div>
      `;

      return;
    }

    sorted.slice(-5).reverse().forEach(t => {

      const div =
        document.createElement("div");

      div.className = "training-item";

      div.innerHTML = `
        <div>
          <strong>${t.type}</strong>
          <small>
            ${formatDate(t.date)}
            · ${t.time || "--:--"}
            · ${t.duration} นาที
          </small>
        </div>

        <button
          class="delete-btn"
          onclick="deleteTraining(${t.id})"
        >
          🗑️
        </button>
      `;

      list.appendChild(div);

    });
  }

  function formatDate(date) {

    const d =
      new Date(date + "T00:00:00");

    return d.toLocaleDateString(
      "th-TH",
      {
        day: "numeric",
        month: "short"
      }
    );
  }

  function updateStreak() {

    const uniqueDates =
      [...new Set(trainings.map(t => t.date))]
      .sort()
      .reverse();

    let streak = 0;

    let check = new Date();

    check.setHours(0,0,0,0);

    while (true) {

      const key = dateKey(check);

      if (uniqueDates.includes(key)) {

        streak++;

        check.setDate(
          check.getDate() - 1
        );

      } else {

        break;

      }
    }

    document.getElementById(
      "streak"
    ).textContent = streak;
  }

  /* ปิด Modal เมื่อแตะพื้นหลัง */
  document.getElementById("modal")
    .addEventListener("click", function(e) {

      if (e.target === this) {
        closeModal();
      }

    });

  /* เริ่มระบบ */
  renderCalendar();
  renderTrainingList();
  updateStreak();

</script>

</body>
</html>
